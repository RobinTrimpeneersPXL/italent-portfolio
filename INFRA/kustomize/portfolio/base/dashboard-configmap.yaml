apiVersion: v1
kind: ConfigMap
metadata:
  name: portfolio-dashboard
  labels:
    grafana_dashboard: "1"
data:
  portfolio-golden-signals.json: |
    {
      "uid": "portfolio-signals",
      "title": "Portfolio Backend - Golden Signals",
      "editable": true,
      "panels": [
        {
          "title": "Active Pods",
          "type": "stat",
          "gridPos": { "h": 4, "w": 24, "x": 0, "y": 0 },
          "targets": [
            { "expr": "count(kube_pod_info{namespace=\"portfolio-prod\"})", "legendFormat": "Pods" }
          ]
        },
        {
          "title": "CPU Usage (Cores)",
          "type": "graph",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "targets": [
            { "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"portfolio-prod\", container!=\"\"}[1m])) by (pod)", "legendFormat": "{{pod}}" }
          ]
        },
        {
          "title": "Memory Usage (MB)",
          "type": "graph",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "targets": [
            { "expr": "sum(container_memory_working_set_bytes{namespace=\"portfolio-prod\", container!=\"\"}) by (pod) / 1024 / 1024", "legendFormat": "{{pod}}" }
          ]
        },
        {
          "title": "Network Traffic (Rx/Tx)",
          "type": "graph",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 12 },
          "targets": [
            { "expr": "sum(rate(container_network_receive_bytes_total{namespace=\"portfolio-prod\"}[1m])) by (pod)", "legendFormat": "Rx {{pod}}" },
            { "expr": "sum(rate(container_network_transmit_bytes_total{namespace=\"portfolio-prod\"}[1m])) by (pod)", "legendFormat": "Tx {{pod}}" }
          ]
        }
      ]
    }
