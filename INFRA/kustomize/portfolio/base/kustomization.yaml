apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - api-deployment.yaml
  - api-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - ingress.yaml
  - rbac.yaml
  - servicemonitor.yaml
  - dashboard-configmap.yaml
  - scaledobject.yaml

images:
- name: backend
  newName: portfolio-backend
  newTag: latest
- name: frontend
  newName: portfolio-frontend
  newTag: latest
