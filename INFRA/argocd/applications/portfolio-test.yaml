apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-test
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/placeholder/italent.git # REPLACE WITH YOUR REPO URL
    targetRevision: HEAD
    path: INFRA/kustomize/portfolio/overlays/test
  destination:
    server: https://kubernetes.default.svc
    namespace: portfolio-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
