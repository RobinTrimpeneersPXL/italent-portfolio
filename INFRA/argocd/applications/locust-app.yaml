apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: locust
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/placeholder/italent.git # REPLACE WITH YOUR REPO URL
    targetRevision: HEAD
    path: INFRA/kustomize/locust/overlays/loadtest
  destination:
    server: https://kubernetes.default.svc
    namespace: locust
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
