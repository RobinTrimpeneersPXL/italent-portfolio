apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RobinTrimpeneersPXL/italent-portfolio.git
    targetRevision: HEAD
    path: INFRA/argocd/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
