name: Build and Deploy

on:
  push:
    tags:
      - "TEST_v*"
      - "PROD_v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Names
        run: |
          echo "IMAGE_NAME_BACKEND=${{ github.repository }}/portfolio-backend" | tr '[:upper:]' '[:lower:]' >> $GITHUB_ENV
          echo "IMAGE_NAME_FRONTEND=${{ github.repository }}/portfolio-frontend" | tr '[:upper:]' '[:lower:]' >> $GITHUB_ENV

      - name: Set Environment Variables
        run: |
          if [[ "${{ github.ref_name }}" == TEST_* ]]; then
            echo "ENV_TYPE=test" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == PROD_* ]]; then
            echo "ENV_TYPE=prod" >> $GITHUB_ENV
          else
            echo "ENV_TYPE=test" >> $GITHUB_ENV # Default for manual dispatch
          fi

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.ref_name || 'latest' }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./Portfolio
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.ref_name || 'latest' }}

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update Kustomize Image Tag
        run: |
          cd INFRA/kustomize/portfolio/overlays/${{ env.ENV_TYPE }}
          kustomize edit set image backend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.ref_name || 'latest' }}
          kustomize edit set image frontend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.ref_name || 'latest' }}

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add INFRA/kustomize/portfolio/overlays/${{ env.ENV_TYPE }}/kustomization.yaml
          git commit -m "Update images for ${{ github.ref_name || 'manual build' }} in ${{ env.ENV_TYPE }}" || echo "No changes to commit"
          git push origin HEAD:${{ github.event.repository.default_branch }}
